<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Hunter</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="scope" hidden></div>
  <div id="dot"></div>
  <div id="label"></div>
  <div id="msg"></div>
  <div id="mission"></div>

  <header class="hud">
    <div class="user">
      <span class="avatar" id="avatar">?</span>
      <div>
        <div class="name" id="username">Loading…</div>
        <a class="link" id="authlink" href="https://start.ng">start.ng</a>
      </div>
    </div>
    <div class="stats">
      <div><span class="label">Score</span><span id="score">0</span></div>
      <div><span class="label">Ammo</span><span id="ammo">15</span></div>
      <div><span class="label">Time</span><span id="time">90</span></div>
      <div><span class="label">Best</span><span id="best">0</span></div>
      <div><span class="label">Level</span><span id="level">1</span></div>
      <div><span class="label">Coins</span><span id="coins">0</span></div>
    </div>
  </header>

  <aside class="guide" id="guide"></aside>
  <button class="walk-btn" id="walkBtn">Walk</button>
  <button class="zoom-btn" id="zoomBtn">Zoom</button>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h1 id="title">Forest Hunter</h1>
      <p id="message"></p>
      <button class="btn" id="action">Play</button>
      <div class="shop" id="shop"></div>
      <ol class="board" id="board"></ol>
      <p class="hint">Mouse look (click to lock) · WASD walk · Shift sprint · click to shoot · hold right-click or Z to zoom (Shift steadies the scope) · arrows look, Space shoots · touch: drag, tap, Walk and Zoom buttons</p>
    </div>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
